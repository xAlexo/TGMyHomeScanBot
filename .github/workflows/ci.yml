name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/test.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Create dummy config.py
      run: |
        cat > config.py << 'EOF'
        # CI dummy config — real config is gitignored and provided at deploy time
        TG_APP_ID = 0
        TG_API_HASH = 'dummy'
        TG_BOT_API_TOKEN = 'dummy'
        TG_APP_TITLE = 'MyHomeScan'
        SCANNER = 'test:0'
        ALLOW_IDS = frozenset([1])
        EOF
    
    - name: Test with pytest
      run: |
        python -m pytest tests/

  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t test-image .
    
    - name: Test Docker image structure
      run: docker run --rm --entrypoint ./ci-check.sh test-image