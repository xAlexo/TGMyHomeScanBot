name: CI, release, publish, and deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/test.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Create dummy config.py
      run: |
        cat > config.py << 'EOF'
        # CI dummy config — real config is gitignored and provided at deploy time
        TG_APP_ID = 0
        TG_API_HASH = 'dummy'
        TG_BOT_API_TOKEN = 'dummy'
        TG_APP_TITLE = 'MyHomeScan'
        SCANNER = 'test:0'
        ALLOW_IDS = frozenset([1])
        EOF

    - name: Test with pytest
      run: |
        python -m pytest tests/

  docker-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t test-image .

    - name: Test Docker image structure
      run: docker run --rm --entrypoint ./ci-check.sh test-image
  release:
    if: github.event_name == 'push'
    needs: [test, docker-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: semantic
        uses: cycjimmy/semantic-release-action@9e1f8a3ef91f1097285028e799a5fb8bb90e8899
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xalexo/tgmyhomescanbot:${{ needs.release.outputs.version }}
            ghcr.io/xalexo/tgmyhomescanbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release, publish]
    if: needs.release.outputs.published == 'true'
    runs-on: [self-hosted, linux, x64, tg-my-home-scan]
    timeout-minutes: 15
    concurrency:
      group: my-home-scan-dokploy-deploy
      cancel-in-progress: false
    steps:
      - name: Redeploy Dokploy Compose application
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_API_KEY"
          test -n "$DOKPLOY_COMPOSE_ID"

          case "$DOKPLOY_URL" in
            https://*) ;;
            *) echo 'DOKPLOY_URL must use HTTPS' >&2; exit 1 ;;
          esac
          curl --silent --show-error --fail \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}" \
            "${DOKPLOY_URL%/}/api/compose.redeploy" >/dev/null
          echo 'Dokploy deployment requested'
